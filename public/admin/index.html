<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Mosk Unlimited – Verwaltung</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  </head>
  <body>
    <!--
      Decap CMS, feste Version + Integrity-Hash: wird die Datei auf dem CDN
      verändert, lädt der Browser sie nicht. Beim Update Version UND Hash anpassen:
      curl -sL https://unpkg.com/decap-cms@<version>/dist/decap-cms.js | openssl dgst -sha384 -binary | openssl base64 -A
    -->
    <script
      src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"
      integrity="sha384-A/Gdn928CNLufmnGWGs9RM4Q9o8bSNLeJERqBFrBjwzL7FRpoLT3MPF8Tl0+Wd2p"
      crossorigin="anonymous"
    ></script>
    <!-- Drag & Drop für den Layout-Editor (Maus + Touch), ebenfalls gepinnt -->
    <script
      src="https://unpkg.com/sortablejs@1.15.7/Sortable.min.js"
      integrity="sha384-DgmC6Xe2bSN2WjTDXzWYbUbxyhNP+NNkGDR/g78pCXV7E7rcVTGxVg0uIVCUUcBc"
      crossorigin="anonymous"
    ></script>
    <script src="/admin/galerie-widget.js"></script>
  </body>
</html>
