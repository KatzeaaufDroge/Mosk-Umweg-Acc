# Admin-Panel für Dima: https://moskunlimited.be/admin
# Login läuft über DecapBridge (decapbridge.com, Site "Mosk Unlimited"),
# Speichern = Git-Commit auf main -> Netlify baut die Seite neu (~1-2 Min).
# Das GitHub-Token liegt nur bei DecapBridge (Fine-grained, nur dieses Repo,
# nur Contents). Läuft es ab, kann Dima nicht mehr speichern -> dort erneuern.
backend:
  name: git-gateway
  repo: KatzeaaufDroge/Mosk-Umweg-Acc
  branch: main
  identity_url: https://auth.decapbridge.com/sites/129547b1-ef84-4d09-b71c-d3343c8bd62d
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

locale: de
site_url: https://moskunlimited.be
display_url: https://moskunlimited.be
logo_url: https://moskunlimited.be/Logo.png

# Hochgeladene Originale landen hier; live werden sie automatisch über
# Netlifys Image CDN verkleinert ausgeliefert (siehe src/data/gallery.ts).
media_folder: public/gallery
public_folder: /gallery

collections:
  - name: galerie
    label: Galerie
    description: >
      Bilder hochladen, löschen oder per Ziehen neu sortieren. Nach dem
      Klick auf „Veröffentlichen" ist die Änderung nach ca. 1–2 Minuten live.
    editor:
      preview: false
    files:
      - name: foto-event
        label: 'Fotografie – Event'
        file: content/galerie/foto-event.json
        fields:
          - { name: title, label: Titel, widget: hidden }
          - name: sichtbar
            label: Auf der Website anzeigen
            widget: boolean
            hint: Aus = Kategorie ist versteckt, die Bilder bleiben aber gespeichert.
          - name: layout
            label: Layout
            widget: galerie-layout
            default: mosaik
            options:
              - { label: 'Mosaik – Bilder im natürlichen Format, versetzt', value: mosaik }
              - { label: 'Raster – gleichmäßig, einzelne Bilder größer möglich', value: raster }
              - { label: 'Highlight – erstes Bild groß, Rest im Raster', value: highlight }
            hint: Vorlage antippen. Reihenfolge und Größen einzelner Bilder unten über „Layout bearbeiten“.
          - name: bilder
            label: Bilder
            label_singular: Bild
            widget: galerie
            add_to_top: true
            summary: '{{fields.beschreibung}}'
            fields:
              - { name: bild, label: Bild, widget: image, choose_url: false }
              - name: beschreibung
                label: Kurzbeschreibung
                widget: string
                required: false
                hint: 'Was ist zu sehen? z.B. „DJ auf der Hauptbühne" – hilft bei Google.'
              - { name: groesse, label: Größe, widget: hidden, required: false }
      - name: foto-moderation
        label: 'Fotografie – Moderation'
        file: content/galerie/foto-moderation.json
        fields:
