# Nur zur Fehlersuche: zeigt, welche Ordner der FTP-Zugang sieht.
# Startet ausschließlich von Hand (Actions -> FTP-Diagnose -> Run workflow).
name: FTP-Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: sudo apt-get install -y lftp >/dev/null
      - name: Ordner auflisten
        env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$U,$P" "$H" -e "set ftp:ssl-allow true; set ssl:verify-certificate no; set net:max-retries 1;
            echo '== Startordner:'; pwd;
            echo '== Inhalt Startordner:'; cls -1 --sort=name;
            echo '== public_html:'; cls -1 public_html/ ;
            echo '== public_html/admin (Datum):'; cls -l public_html/admin/galerie-status.json;
            echo '== domains:'; cls -1 domains/ ;
            echo '== domains/moskunlimited.be/public_html/admin:'; cls -l domains/moskunlimited.be/public_html/admin/galerie-status.json;
            bye" || true
