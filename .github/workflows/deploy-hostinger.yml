# Baut die Website und lädt sie zu Hostinger hoch.
# Läuft bei jedem Push auf main – auch wenn Dima im Admin-Panel veröffentlicht.
#
# Einmalig in GitHub einrichten (Settings -> Secrets and variables -> Actions):
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD   (aus Hostinger -> Dateien -> FTP-Konten)
#   Variablen: FTP_SERVER_DIR  (optional, Standard "./" = FTP-Konto zeigt direkt auf public_html)
#              FTP_PROTOCOL    (optional, Standard "ftps")
# Der Resend-Schlüssel gehört NICHT hierher, sondern in mosk-config.php auf dem Server
# (siehe public/api/contact.php).

name: Deploy zu Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nie zwei Uploads gleichzeitig; ein neuer wartet, bis der laufende fertig ist
concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Website bauen (inkl. verkleinerter Galerie-Bilder)
        run: npm run build

      - name: Zugangsdaten vorhanden?
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::FTP_SERVER, FTP_USERNAME oder FTP_PASSWORD fehlt in den Repository-Secrets."
            exit 1
          fi

      - name: Zu Hostinger hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
